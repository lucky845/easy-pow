# CI 测试链:push main / 任意 PR 触发,跑 mvn -B verify(编译 + 单测 + 打包全量校验)。
# 配合 main 分支保护的 required status check,把 PR 流从流程约束变成机器强制。
# 发布链见 release.yml(仅 tag 触发,互不干扰)。
name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# group 必须带 github.ref:全局 group 会让并发 PR run 相互取消(前车之鉴)。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build & Test
        run: mvn -B verify
